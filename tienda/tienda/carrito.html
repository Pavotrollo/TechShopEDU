<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechShop EDU | Carrito</title>
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">


    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <nav class="navbar navbar-expand-lg barra" data-bs-theme="dark" aria-label="Principal">
            <a class="logo" href="index.html" aria-label="TechShop EDU, ir al inicio">
                <img src="img/logo.svg" alt="" width="40" height="40">
                <span class="logo__texto">TechShop <span class="logo__edu">EDU</span></span>
            </a>

            <!-- Botón del carrito: apunta a carrito.html y #cart-badge muestra cuántas piezas hay -->
            <a class="btn-carrito order-1 order-lg-3" href="carrito.html" id="btn-carrito" aria-label="Ver carrito">
                Carrito
                <span class="badge" id="cart-badge">0</span>
            </a>

            <button class="navbar-toggler order-2 order-lg-4" type="button" data-bs-toggle="collapse"
                data-bs-target="#menu-principal" aria-controls="menu-principal" aria-expanded="false"
                aria-label="Abrir menú">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse order-3 order-lg-2" id="menu-principal">
                <ul class="navbar-nav ms-lg-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Catálogo</a>
                    </li>
                    <li class="nav-item"><a class="nav-link" href="faq.html">FAQ</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- SECCION DEL CARRITO  -->
    <section class="carrito-seccion" id="carrito" aria-label="Carrito de compras">
        <h1>Carrito</h1>

        <div id="carrito-contenido" class="carrito__contenido">
            <p class="vacio" id="carrito-vacio">Tu carrito está vacío.</p>
        </div>

        <div class="carrito__totales">
            <div class="d-flex justify-content-between">
                <span>Subtotal:</span>
                <span id="carrito-total" aria-live="polite">$0.00</span>
            </div>
        </div>
        <p class="carrito__nota">El envío y los impuestos se calculan en el checkout.</p>


        <a href="checkout.html" class="btn btn--checkout" id="btn-checkout">Ir a Pagar</a>
    </section>
    <!-- FIN: SECCIÓN DEL CARRITO -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utilidades.js"></script>
    <script src="js/carrito.js"></script>
</body>

</html>
